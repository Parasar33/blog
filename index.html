<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parasar's Gallery</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="blog.css">
</head>

<body>

    <!-- Welcome Modal -->
    <div id="welcomeModal" class="auth-modal">
        <div class="auth-content">
            <span class="close-welcome">&times;</span>
            <h2>Welcome to the Gallery 🎨</h2>
            <p>You're entering a private artistic space!</p>
            <p>Your discretion enriches this experience!!</p>
        </div>
    </div>

    <!-- Header -->
    <header>
        <div class="header-content">
            <h1>Rishav's Gallery</h1>
            <p>Paintings • Sketches • Poems</p>
        </div>

        <!-- CENTERED NAV -->
        <nav>
            <a href="#" class="active" data-filter="all">All</a>
            <a href="#" data-filter="painting">Paintings</a>
            <a href="#" data-filter="sketch">Sketches</a>
            <a href="#" data-filter="poem">Poems</a>
        </nav>
    </header>

    <!-- Search Section -->
    <div class="search-section">
        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="Search artwork...">
            <i class="fas fa-search"></i>
        </div>
        <div class="tags-container">
            <!-- Tags injected by JS -->
        </div>
    </div>

    <!-- Main Content -->
    <main>
        <div class="content-grid">
            <div class="loading">
                <i class="fas fa-spinner fa-spin"></i>
                <p>Loading artwork...</p>
            </div>
        </div>
    </main>

    <!-- Artwork Modal -->
    <div class="modal" id="postModal">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <div class="modal-body"></div>
        </div>
    </div>

    <!-- Comment Modal -->
    <div class="modal" id="commentModal">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <h2 style="text-align:center; margin-bottom:1rem;">Leave an Anonymous Comment</h2>

            <form id="commentForm">
                <input type="hidden" name="Title" id="Title" value="">

                <input type="text" name="Name" placeholder="Anonymous name" required>
                <textarea name="Message" placeholder="Your comment..." rows="4" required></textarea>

                <!-- Hidden field for artwork title -->
                <input type="hidden" name="Tag" id="commentTag" value="">

                <button type="submit">
                    <i class="fas fa-paper-plane"></i> Send
                </button>

                <p id="msg" style="margin-top:1rem; text-align:center;"></p>
            </form>
        </div>
    </div>

    <!-- Footer -->
    <footer>
        <div class="footer-content">
            <div class="social-links">
                <a href="https://github.com/parasar33" target="_blank"><i class="fab fa-github"></i></a>
                <a href="https://www.linkedin.com/in/rishav-parasar/" target="_blank"><i
                        class="fab fa-linkedin"></i></a>
                <a href="https://parasar33.github.io/Rishav_resume" target="_blank"><i class="fas fa-globe"></i></a>
            </div>
            <p>&copy; 2025 Rishav Parasar. All rights reserved.</p>
        </div>
    </footer>

    <!-- JS -->
    <script src="blog.js"></script>

</body>

</html>
